# Despliegue en Fly.io. Cambia "app" por un nombre único. Guía completa en DESPLIEGUE.md
app = "abasto-cloud"
primary_region = "mia"

[build]

[env]
  PORT = "8080"
  DATA_DIR = "/data"
  TRUST_PROXY = "1"

# SQLite escribe en un disco persistente. Mantén UNA sola máquina (no escalar a varias).
[[mounts]]
  source = "abasto_data"
  destination = "/data"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    path = "/api/health"
    interval = "30s"
    timeout = "5s"
    grace_period = "15s"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
