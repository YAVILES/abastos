<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f7b5f">
<meta name="robots" content="noindex">
<title>Reparto</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%230f7b5f'/%3E%3Ccircle cx='10' cy='22' r='3' fill='none' stroke='white' stroke-width='2'/%3E%3Ccircle cx='23' cy='22' r='3' fill='none' stroke='white' stroke-width='2'/%3E%3Cpath d='M10 22l4-9h5l4 9' fill='none' stroke='white' stroke-width='2'/%3E%3C/svg%3E">
<link rel="stylesheet" href="/styles.css">
<style>
  .r-head { position: sticky; top: 0; z-index: 20; background: var(--brand); color: #fff; padding: 10px 14px; display: flex; align-items: center; gap: 10px; }
  .r-head b { flex: 1; } .r-head .btn { background: rgba(255,255,255,.15); color: #fff; border-color: transparent; }
  .r-wrap { max-width: 640px; margin: 0 auto; padding: 14px 14px 90px; }
  .r-tabs { display: flex; gap: 6px; overflow-x: auto; margin-bottom: 12px; }
  .r-tabs .btn { white-space: nowrap; }
  .entrega { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 14px; margin-bottom: 12px; box-shadow: var(--shadow); }
  .entrega.nuevo { border-color: var(--warn); box-shadow: 0 0 0 3px var(--warn-l); }
  .entrega .dir { font-size: 17px; font-weight: 700; line-height: 1.3; margin: 6px 0; }
  .pasos-rep { display: flex; gap: 6px; margin: 8px 0; font-size: 12px; }
  .pasos-rep span { flex: 1; text-align: center; padding: 6px 4px; border-radius: 8px; background: #eef0f2; color: #6b7280; }
  .pasos-rep span.actual { background: #fff3cd; color: #7a5b00; font-weight: 700; }
  .pasos-rep span.hecho { background: #d7f0e3; color: #0b6b43; font-weight: 700; }
  .pasos-rep span.mal { background: #fde0e0; color: #9b1c1c; font-weight: 700; }
  .pasos-rep .paso { flex: 1; text-align: center; padding: 11px 4px; border-radius: 8px; border: 1px solid #c9ced6; background: #fff; color: #374151; font: inherit; font-size: 12px; cursor: pointer; }
  .pasos-rep .paso.actual { background: #0f7b5f; border-color: #0f7b5f; color: #fff; font-weight: 700; }
  .entrega .cobro { background: #fff7e0; border: 1px solid #f0d58c; border-radius: 10px; padding: 8px 10px; margin: 6px 0; line-height: 1.4; }
  .entrega .acc { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 10px; }
  .entrega .acc .btn { flex: 1; min-width: 120px; text-align: center; padding: 12px 10px; }
</style>
</head>
<body>
<div id="r"></div><div id="toasts"></div>
<script src="/reparto/reparto.js"></script>
</body>
</html>
