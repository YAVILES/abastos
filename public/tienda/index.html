<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b1b34">
<title>Pedidos al abasto</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%230f7b5f'/%3E%3Cpath d='M8 12h16l-2 11H10z' fill='none' stroke='white' stroke-width='2'/%3E%3Cpath d='M12 12a4 4 0 018 0' fill='none' stroke='white' stroke-width='2'/%3E%3C/svg%3E">
<link rel="stylesheet" href="/styles.css">
<style>
  body { padding-bottom: 80px; }
  .t-head { position: sticky; top: 0; z-index: 20; background: var(--brand); color: #fff; padding: 10px 14px; display: flex; align-items: center; gap: 10px; }
  .t-head b { flex: 1; font-size: 16px; } .t-head .btn { background: rgba(255,255,255,.15); color: #fff; border-color: transparent; }
  .t-wrap { max-width: 760px; margin: 0 auto; padding: 14px; }
  .prods { display: grid; grid-template-columns: repeat(auto-fill, minmax(165px, 1fr)); gap: 10px; }
  .prod { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 12px; display: flex; flex-direction: column; gap: 4px; }
  .prod .n { font-weight: 700; line-height: 1.25; } .prod .p { font-size: 18px; font-weight: 800; color: var(--brand); }
  .cats { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 6px; margin: 10px 0; } .cats .btn { white-space: nowrap; }
  .barra-carro { position: fixed; left: 0; right: 0; bottom: 0; padding: 10px 14px calc(10px + env(safe-area-inset-bottom)); background: var(--panel); border-top: 1px solid var(--line); z-index: 25; }
  .barra-carro .btn { width: 100%; max-width: 732px; display: block; margin: 0 auto; }
  .medio { border: 1px solid var(--line); border-radius: 10px; padding: 10px; margin-bottom: 8px; cursor: pointer; }
  .medio.sel { border-color: var(--brand); background: var(--brand-l); }
  .medio code { background: var(--bg); padding: 1px 6px; border-radius: 4px; user-select: all; }
</style>
<link rel="stylesheet" href="/app-movil.css">
</head>
<body>
<div id="t"></div><div id="toasts"></div>
<script src="/tienda/tienda.js"></script>
</body>
</html>
